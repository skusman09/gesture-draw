[tool.poetry]
name = "air-canvas"
version = "0.1.0"
description = "Air Canvas - hand-tracked drawing app"
authors = ["Your Name <you@example.com>"]
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
opencv-python = ">=4.7.0"
mediapipe = "==0.10.35"
numpy = ">=1.26.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
mypy = ">=1.10.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.pyright]
extraPaths = ["."]

